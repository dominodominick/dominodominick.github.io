<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GooParty</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
      background: radial-gradient(circle at 50% 40%, #7ee8fa 0%, #3aa0ff 55%, #1d4fd8 100%);
      overflow: hidden;
    }
    .launch {
      font: inherit;
      font-size: clamp(1.8rem, 6vw, 4rem);
      color: #fff;
      text-decoration: none;
      padding: 0.6em 1.4em;
      border: 6px solid #fff;
      border-radius: 999px;
      background: linear-gradient(180deg, #8dff6a 0%, #2fcf3a 55%, #1ea52a 100%);
      box-shadow: 0 10px 0 #157a1e, 0 18px 40px rgba(0, 0, 0, 0.35);
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      animation: bob 2.4s ease-in-out infinite;
    }
    .launch:hover { transform: scale(1.06); }
    .launch:active {
      transform: translateY(8px);
      box-shadow: 0 2px 0 #157a1e, 0 8px 20px rgba(0, 0, 0, 0.35);
      animation: none;
    }
    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -10px; }
    }
  </style>
</head>
<body>
  <a class="launch" href="https://dominodominick.github.io/GooParty/">Launch GooParty</a>
</body>
</html>
