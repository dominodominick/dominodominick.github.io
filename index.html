<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domino Dominick</title>
  <meta name="description" content="Domino Dominick on YouTube">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2rem;
      padding: 2rem 1.25rem 5rem;
      text-align: center;
      color: #fff;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.06) 0 2px, transparent 3px) 0 0 / 46px 46px,
        radial-gradient(circle at 50% 35%, #2b2b38 0%, #15151c 60%, #0b0b10 100%);
    }

    /* domino logo */
    .domino {
      width: 74px; height: 140px;
      background: #f7f7f2;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: grid;
      grid-template-rows: 1fr 3px 1fr;
      padding: 10px;
      transform: rotate(-12deg);
    }
    .domino .line { background: #15151c; border-radius: 2px; }
    .half {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      place-items: center;
    }
    .pip { width: 11px; height: 11px; border-radius: 50%; background: #15151c; }

    h1 {
      font-size: clamp(2.6rem, 9vw, 6rem);
      line-height: 1;
      letter-spacing: -0.02em;
      text-shadow: 0 6px 0 rgba(0,0,0,0.35);
    }
    .tagline {
      margin-top: 0.8rem;
      font-size: clamp(1rem, 2.6vw, 1.3rem);
      color: #b9b9c8;
      font-family: system-ui, sans-serif;
    }

    .yt {
      display: inline-flex;
      align-items: center;
      gap: 0.7em;
      font: inherit;
      font-size: clamp(1.2rem, 3.6vw, 1.7rem);
      color: #fff;
      text-decoration: none;
      padding: 0.75em 1.6em;
      border-radius: 999px;
      background: #ff0033;
      box-shadow: 0 8px 0 #a3001f, 0 16px 36px rgba(255,0,51,0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .yt:hover { transform: translateY(-2px) scale(1.03); }
    .yt:active { transform: translateY(6px); box-shadow: 0 2px 0 #a3001f, 0 6px 16px rgba(255,0,51,0.3); }
    .yt svg { width: 1.4em; height: 1.4em; flex: none; }
    .handle {
      margin-top: 0.9rem;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      color: #8d8d9c;
    }
    .handle a { color: inherit; }

    .goo {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #9cf58a;
      text-decoration: none;
      padding: 0.45em 1.1em;
      border: 1.5px solid rgba(156,245,138,0.45);
      border-radius: 999px;
      background: rgba(47,207,58,0.08);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .goo:hover { background: rgba(47,207,58,0.2); border-color: #9cf58a; }
  </style>
</head>
<body>
  <div class="domino" aria-hidden="true">
    <div class="half">
      <span class="pip" style="grid-area:1/1"></span>
      <span class="pip" style="grid-area:2/2"></span>
      <span class="pip" style="grid-area:3/3"></span>
    </div>
    <div class="line"></div>
    <div class="half">
      <span class="pip" style="grid-area:1/1"></span>
      <span class="pip" style="grid-area:1/3"></span>
      <span class="pip" style="grid-area:3/1"></span>
      <span class="pip" style="grid-area:3/3"></span>
    </div>
  </div>

  <header>
    <h1>Domino Dominick</h1>
    <p class="tagline">Videos, games and more — come hang out on the channel.</p>
  </header>

  <div>
    <a class="yt" href="https://youtube.com/dominodominick" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M9.5 7.5v9l7.5-4.5z"/></svg>
      Watch on YouTube
    </a>
    <p class="handle"><a href="https://youtube.com/dominodominick" target="_blank" rel="noopener">youtube.com/dominodominick</a></p>
  </div>

  <a class="goo" href="https://dominodominick.com/gooparty">▶ Launch GooParty</a>
</body>
</html>
