<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domino Dominick</title>
  <meta name="description" content="Domino Dominick on YouTube — i do a little bit of everything.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 90'%3E%3Crect width='180' height='90' rx='14'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='20' cy='21' r='9'/%3E%3Ccircle cx='68' cy='21' r='9'/%3E%3Ccircle cx='44' cy='45' r='9'/%3E%3Ccircle cx='20' cy='69' r='9'/%3E%3Ccircle cx='68' cy='69' r='9'/%3E%3Crect x='88' y='10' width='4' height='70' rx='2'/%3E%3Ccircle cx='110' cy='21' r='9'/%3E%3Ccircle cx='136' cy='21' r='9'/%3E%3Ccircle cx='162' cy='21' r='9'/%3E%3Ccircle cx='110' cy='69' r='9'/%3E%3Ccircle cx='136' cy='69' r='9'/%3E%3Ccircle cx='162' cy='69' r='9'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #111;
      --muted: #6b6b6b;
      --line: #e8e8e8;
      --red: #ff0033;
    }
    body {
      background: #fff;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 1.25rem; }

    /* top bar */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 0;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 800; text-decoration: none; }
    .brand svg { width: 44px; height: auto; }
    .goo {
      font-size: 0.85rem; font-weight: 600; text-decoration: none;
      padding: 0.4em 0.95em; border: 1.5px solid var(--line); border-radius: 999px;
      color: var(--muted); transition: border-color .15s, color .15s;
    }
    .goo:hover { border-color: var(--ink); color: var(--ink); }

    /* hero */
    .hero { text-align: center; padding: 3.5rem 0 3rem; }
    .hero .logo { width: min(260px, 60vw); height: auto; transform: rotate(-6deg); filter: drop-shadow(0 14px 22px rgba(0,0,0,.18)); }
    h1 {
      margin-top: 2rem;
      font-size: clamp(2.6rem, 8vw, 5.2rem);
      line-height: 1; letter-spacing: -0.035em; font-weight: 900;
    }
    .tagline { margin-top: 0.8rem; font-size: clamp(1.05rem, 2.4vw, 1.3rem); color: var(--muted); }
    .stats { margin-top: 0.4rem; font-size: 0.95rem; color: var(--muted); }
    .actions { margin-top: 1.8rem; display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.55em;
      font-weight: 700; font-size: 1.05rem; text-decoration: none;
      padding: 0.8em 1.5em; border-radius: 999px; transition: transform .12s, background .15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn svg { width: 1.2em; height: 1.2em; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover { background: #e0002d; }
    .btn-ghost { border: 2px solid var(--ink); }

    /* sections */
    section { padding: 2.5rem 0; border-top: 1px solid var(--line); }
    h2 { font-size: 1.5rem; letter-spacing: -0.02em; margin-bottom: 1.2rem; }
    .player {
      position: relative; aspect-ratio: 16 / 9; width: 100%;
      border-radius: 16px; overflow: hidden; background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.4rem 1.1rem; }
    .vid { text-decoration: none; display: block; }
    .vid .thumb {
      aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #f2f2f2;
    }
    .vid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
    .vid:hover img { transform: scale(1.05); }
    .vid h3 { margin-top: 0.55rem; font-size: 0.98rem; font-weight: 650; line-height: 1.3; }
    .more { margin-top: 1.6rem; text-align: center; }

    footer { padding: 2.5rem 0 3rem; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 0.9rem; }
    footer a { text-decoration: none; font-weight: 600; color: var(--ink); }
  </style>
</head>
<body>
  <!-- the domino logo, reused below -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="domino" viewBox="0 0 180 90">
      <rect width="180" height="90" rx="14" fill="#111"/>
      <g fill="#fff">
        <circle cx="20" cy="21" r="8.5"/><circle cx="68" cy="21" r="8.5"/>
        <circle cx="44" cy="45" r="8.5"/>
        <circle cx="20" cy="69" r="8.5"/><circle cx="68" cy="69" r="8.5"/>
        <rect x="88" y="10" width="4" height="70" rx="2"/>
        <circle cx="110" cy="21" r="8.5"/><circle cx="136" cy="21" r="8.5"/><circle cx="162" cy="21" r="8.5"/>
        <circle cx="110" cy="69" r="8.5"/><circle cx="136" cy="69" r="8.5"/><circle cx="162" cy="69" r="8.5"/>
      </g>
    </symbol>
  </svg>

  <div class="wrap">
    <nav>
      <a class="brand" href="/"><svg viewBox="0 0 180 90"><use href="#domino"/></svg>Domino Dominick</a>
      <a class="goo" href="https://dominodominick.com/gooparty">Launch GooParty →</a>
    </nav>

    <header class="hero">
      <svg class="logo" viewBox="0 0 180 90" role="img" aria-label="Domino logo"><use href="#domino"/></svg>
      <h1>Domino Dominick</h1>
      <p class="tagline">i do a little bit of everything</p>
      <p class="stats">Gaming, playthroughs, Wii Party, and whatever else happens.</p>
      <div class="actions">
        <a class="btn btn-red" href="https://www.youtube.com/@dominodominick?sub_confirmation=1" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>
          Subscribe
        </a>
        <a class="btn btn-ghost" href="https://www.youtube.com/@dominodominick/videos" target="_blank" rel="noopener">All videos</a>
      </div>
    </header>

    <section>
      <h2>Newest video</h2>
      <div class="player">
        <iframe src="https://www.youtube.com/embed/lTS92OIdEVA" title="Top 18 Ways to Eat Goldfish!" loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </section>

    <section>
      <h2>Recent videos</h2>
      <div class="grid" id="grid"></div>
      <p class="more"><a class="btn btn-ghost" href="https://www.youtube.com/@dominodominick/videos" target="_blank" rel="noopener">See all 83+ videos</a></p>
    </section>

    <footer>
      <p><a href="https://www.youtube.com/@dominodominick" target="_blank" rel="noopener">youtube.com/@dominodominick</a></p>
      <p style="margin-top:.4rem">© Domino Dominick</p>
    </footer>
  </div>

  <script>
    const videos = [
      ["n8sChlOd2xg", "Portal playthrough #3 (finale)"],
      ["Zwd_pTzg1Pw", "the biggest comeback in wii party history"],
      ["3kJX_PtVkGI", "Wii Party standard difficulty with luke"],
      ["dmAe98TvHn8", "i beat standard so i went to advanced..."],
      ["gpnYon7-k9w", "FNAF HELP WANTED"],
      ["WWwOopvMDF0", "FNAF HELP WANTED dark rooms"],
      ["G-8PDtpeJNE", "Portal playthrough #2"],
      ["81MYodtUoS8", "Portal playthrough #1"],
    ];
    document.getElementById("grid").innerHTML = videos.map(([id, title]) => `
      <a class="vid" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">
        <div class="thumb"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"></div>
        <h3>${title}</h3>
      </a>`).join("");
  </script>
</body>
</html>
